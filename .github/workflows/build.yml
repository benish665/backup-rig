name: Build Backup Rig

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            config: -A x64
          - name: macOS
            os: macos-14
            config: -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Linux
            os: ubuntu-22.04
            config: -G Ninja -DCMAKE_BUILD_TYPE=Release
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build ${{ matrix.config }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          A=build/BackupRig_artefacts/Release
          cp -R "$A/VST3/Backup Rig.vst3" out/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "$A/AU/Backup Rig.component" out/
            cp -R "$A/Standalone/Backup Rig.app" out/
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp "$A/Standalone/Backup Rig.exe" out/
          else
            cp "$A/Standalone/Backup Rig" out/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BackupRig-${{ matrix.name }}
          path: out

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Zip and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd art
          for d in */; do d=${d%/}; (cd "$d" && zip -qry "../$d.zip" .); done
          ls -la
          gh release create "$GITHUB_REF_NAME" *.zip --repo "$GITHUB_REPOSITORY" --title "Backup Rig $GITHUB_REF_NAME" --notes-file - <<'NOTES'
          ## ריג גיבוי: פלאגין גיטרה (VST3 / AU / אפליקציה עצמאית)

          מורידים את הקובץ שמתאים למחשב שלכם מהרשימה למטה (Assets):
          - **BackupRig-Windows.zip**: מעתיקים את `Backup Rig.vst3` ל-`C:\Program Files\Common Files\VST3\`. את `Backup Rig.exe` אפשר להפעיל בלי DAW: ב-Options > Audio/MIDI Settings בוחרים ASIO ובאפר 64 או 128. אם Windows מציג אזהרה: More info ואז Run anyway.
          - **BackupRig-macOS.zip**: את `Backup Rig.vst3` מעתיקים ל-`~/Library/Audio/Plug-Ins/VST3/`, ואת `Backup Rig.component` ל-`~/Library/Audio/Plug-Ins/Components/`. הקבצים לא חתומים, אז בפעם הראשונה מריצים בטרמינל `xattr -cr` על הקבצים.
          - **BackupRig-Linux.zip**: מעתיקים את `Backup Rig.vst3` ל-`~/.vst3/`.

          ארבעה ריגים: CLEAN, SKY, PLEXI ו-LEAD, עם טיונר, נויז גייט וכיול כניסה.
          NOTES
